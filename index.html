<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Bugiganga - Sua Loja de Confiança</title>
    <!-- Mantenha todos os seus estilos (CSS) e metadados originais aqui -->
</head>
<body>
    <!-- Mantenha todo o seu cabeçalho, catálogo e modais originais aqui -->
    
    <!-- Exemplo de como o botão de compra deve ficar no seu modal de produto -->
    <!-- <button id="btn-checkout" data-produto="Fênix Smartwatch" data-preco="299.90">Ir para Pagamento Seguro</button> -->

    <!-- Script de Integração com Cloudflare + InfinitePay -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Adicione esta classe ou ID aos seus botões de compra existentes
            const botoesCompra = document.querySelectorAll('.btn-comprar-agora'); 
            
            botoesCompra.forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    e.preventDefault();
                    const produto = btn.getAttribute('data-nome');
                    const preco = parseFloat(btn.getAttribute('data-preco'));
                    
                    btn.textContent = 'Gerando link de pagamento...';
                    btn.disabled = true;

                    try {
                        const response = await fetch('/api/create-checkout', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ 
                                produto: produto, 
                                preco: preco,
                                infiniteTag: 'denys_lucio_da_c'
                            })
                        });

                        const data = await response.json();
                        if (data.url) {
                            // Redireciona o cliente para o checkout da InfinitePay
                            window.location.href = data.url;
                        } else {
                            alert('Erro ao gerar link de pagamento. Tente novamente.');
                            btn.textContent = 'Ir para Pagamento Seguro';
                            btn.disabled = false;
                        }
                    } catch (error) {
                        console.error('Erro:', error);
                        alert('Erro de conexão. Verifique sua internet.');
                        btn.textContent = 'Ir para Pagamento Seguro';
                        btn.disabled = false;
                    }
                });
            });
        });
    </script>
</body>
</html>
